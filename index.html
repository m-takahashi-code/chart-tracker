<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新店チャート手配台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --paper:#FDF3F6;
    --card:#FFFFFF;
    --ink:#5B4A52;
    --muted:#B99AA6;
    --line:#F5DCE4;
    --chip-empty:#FAECEF;
    --red:#F2A6B4;
    --red-text:#C05C72;
    --teal:#8FD8C8;
    --teal-text:#3E9683;
    --amber:#FAD08A;
    --amber-text:#C98A3A;
    --shadow-line:#00000010;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px dashed var(--line);
    padding-bottom:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:12px;
  }
  .header h1{
    font-family:'Kiwi Maru', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:.03em;
  }
  .header p{
    margin:0;
    font-size:13px;
    color:var(--muted);
    font-family:'Quicksand', sans-serif;
  }
  .stamp{
    font-family:'Kiwi Maru', serif;
    font-weight:500;
    font-size:13px;
    color:var(--red-text);
    background:var(--chip-empty);
    border:2px solid var(--red);
    border-radius:20px;
    padding:6px 16px;
    transform:rotate(-4deg);
    white-space:nowrap;
  }

  /* inventory */
  .section-title{
    font-family:'Kiwi Maru', serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";
    width:6px;height:6px;
    background:var(--ink);
    display:inline-block;
  }
  .depot-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:14px;
  }
  .depot-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .depot-card .name{font-size:12px;color:var(--muted);margin-bottom:6px;font-family:'Quicksand', sans-serif;}
  .depot-card .stockrow{display:flex;align-items:center;gap:8px;}
  .depot-card input{
    width:56px;font-size:18px;font-weight:700;
    font-family:'Quicksand', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:2px 0;
  }
  .depot-card input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .depot-card .alloc{font-size:11px;color:var(--muted);margin-top:6px;}
  .depot-card .alloc b{color:var(--ink);}
  .depot-card .alloc.warn b{color:var(--red-text);}
  .depot-name-input{
    display:block;width:100%;
    font-size:12px !important;font-weight:500 !important;
    color:var(--muted) !important;
    margin-bottom:6px;
  }
  .depot-delete{
    position:absolute;top:6px;right:8px;
    background:none;border:none;
    color:var(--muted);font-size:14px;
    cursor:pointer;line-height:1;padding:2px 4px;
  }
  .depot-delete:hover{color:var(--red-text);}
  .depot-add-card{
    display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--line);
    background:transparent;cursor:pointer;
    min-height:70px;
  }
  .depot-add-inner{font-size:12px;color:var(--muted);font-family:'Quicksand', sans-serif;}
  .depot-add-card:hover{border-color:var(--teal);}
  .depot-add-card:hover .depot-add-inner{color:var(--teal-text);}

  .totals-bar{
    display:flex;gap:18px;flex-wrap:wrap;
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 16px;
    margin-bottom:30px;
  }
  .totals-bar span b{font-size:16px;}

  .add-store-row{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .add-store-input{
    font-size:13px;
    font-family:'Zen Maru Gothic', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:4px 2px;flex:1;min-width:140px;
  }
  .add-store-input-small{flex:0 0 170px;min-width:120px;}
  .date-field{display:flex;flex-direction:column;gap:2px;}
  .date-field-label{font-size:10px;color:var(--muted);font-family:'Quicksand', sans-serif;}
  .dates-edit{display:flex;gap:14px;margin-top:4px;}
  .date-input{
    font-size:12px;
    font-family:'Quicksand', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:3px 2px;
  }
  .date-input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .add-store-input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .add-store-btn{
    background:var(--teal);border:none;color:var(--teal-text);
    font-family:'Zen Maru Gothic', sans-serif;font-weight:700;
    font-size:13px;padding:8px 16px;border-radius:20px;
    cursor:pointer;white-space:nowrap;
  }
  .add-store-btn:hover{opacity:.85;}

  /* store cards */
  .store-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .store-delete{
    position:absolute;top:14px;right:14px;
    background:none;border:none;
    color:var(--muted);font-size:16px;
    cursor:pointer;line-height:1;padding:4px 6px;
    z-index:2;
  }
  .store-delete:hover{color:var(--red-text);}
  .store-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;gap:10px;
    margin-bottom:12px;
  }
  .store-name-block .badge{
    display:inline-block;
    font-family:'Quicksand', sans-serif;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:12px;
    margin-bottom:6px;
  }
  .badge.urgent{background:var(--red);color:var(--red-text);}
  .badge.soon{background:var(--amber);color:var(--amber-text);}
  .badge.ok{background:var(--teal);color:var(--teal-text);}
  .badge.tbd{background:var(--chip-empty);color:var(--muted);}
  .store-name-block h3{
    font-family:'Kiwi Maru', serif;
    font-size:18px;margin:0 0 4px;
  }
  .dates{font-size:12px;color:var(--muted);font-family:'Quicksand', sans-serif;}

  .depot-select{
    font-size:12px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    border:1px solid var(--line);
    border-radius:10px;
    padding:5px 8px;
    background:#fff;
    color:var(--ink);
  }

  .progress-block{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px;}
  .progress-row{display:flex;flex-direction:column;gap:6px;}
  .progress-row .label{font-size:11px;color:var(--muted);font-family:'Quicksand', sans-serif;letter-spacing:.05em;}
  .chips{display:flex;gap:6px;}
  .sample-meta{display:flex;gap:8px;margin-top:2px;}
  .mini-input{
    font-size:11px;
    font-family:'Zen Maru Gothic', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:2px 2px;width:110px;
  }
  .mini-input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .mini-input::placeholder{color:var(--muted);}
  .mini-select{
    font-size:11px;
    font-family:'Zen Maru Gothic', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:2px 2px;width:110px;
  }
  .mini-select:focus{outline:none;border-bottom:1px solid var(--ink);}
  .alloc-slots{display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap;}
  .alloc-slot{display:flex;gap:4px;align-items:center;}
  .qty-input{
    width:32px;font-size:11px;
    font-family:'Quicksand', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:2px 2px;text-align:center;
  }
  .qty-input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .alloc-total{
    font-size:11px;font-family:'Quicksand', sans-serif;font-weight:600;
    color:var(--teal-text);
  }
  .alloc-total.mismatch{color:var(--amber-text);}
  .chip{
    width:22px;height:22px;
    border:1.5px solid var(--line);
    background:var(--chip-empty);
    cursor:pointer;
    transition:background .1s, transform .1s;
  }
  .chip.circle{border-radius:50%;}
  .chip.square{border-radius:5px;}
  .chip.diamond{transform:rotate(45deg);}
  .chip.diamond.on{transform:rotate(45deg) scale(1);}
  .chip.on.circle{background:var(--teal);border-color:var(--teal);}
  .chip.on.diamond{background:var(--red);border-color:var(--red);}
  .chip.on.square{background:var(--amber);border-color:var(--amber);}
  .chip:hover{transform:scale(1.1);}
  .chip.diamond:hover{transform:rotate(45deg) scale(1.1);}

  .status-note-row{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;
  }
  .ship-row{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:6px;padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .ship-label{font-size:11px;color:var(--muted);font-family:'Quicksand', sans-serif;letter-spacing:.05em;}
  .ship-status-select{
    font-size:12px;font-weight:700;
    font-family:'Zen Maru Gothic', sans-serif;
    border:none;border-radius:20px;
    padding:5px 12px;cursor:pointer;
  }
  .ship-status-select.ship-status-未発送{background:var(--chip-empty);color:var(--muted);}
  .ship-status-select.ship-status-発送済み{background:var(--amber);color:var(--amber-text);}
  .ship-status-select.ship-status-到着済み{background:var(--teal);color:var(--teal-text);}
  .status-label{
    font-family:'Quicksand', sans-serif;
    font-size:12px;font-weight:700;
  }
  .status-label.done{color:var(--teal-text);}
  .status-label.partial{color:var(--amber-text);}
  .status-label.none{color:var(--muted);}

  .note-input{
    flex:1;min-width:160px;
    font-size:12px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    padding:4px 2px;
  }
  .note-input:focus{outline:none;border-bottom:1px solid var(--ink);}

  .complete-stamp{
    position:absolute;
    top:14px;right:14px;
    font-family:'Kiwi Maru', serif;
    font-weight:500;
    font-size:18px;
    color:var(--teal-text);
    background:#fff;
    border:2px solid var(--teal);
    border-radius:50%;
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(10deg);
    letter-spacing:.05em;
    pointer-events:none;
  }

  .footer-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:24px;font-size:11px;color:var(--muted);
    font-family:'Quicksand', sans-serif;
  }
  .reset-btn{
    background:none;border:1px solid var(--line);
    border-radius:10px;padding:6px 12px;
    font-size:11px;color:var(--muted);cursor:pointer;
    font-family:'Quicksand', sans-serif;
  }
  .reset-btn:hover{border-color:var(--red);color:var(--red);}
  .loading{padding:40px;text-align:center;color:var(--muted);font-family:'Quicksand', sans-serif;font-size:13px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">読み込み中...</div>
</div>

<script>
const STORAGE_KEY = 'chart-tracker-state-v1';

// ▼▼▼ ここにFirebaseの設定値を貼り付けてください（手順はREADME参照） ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyAdlyFQvZqXI3eF4HWHN4_qUdtb-LCgVGY",
  authDomain: "chart-tracker-d6909.firebaseapp.com",
  databaseURL: "https://chart-tracker-d6909-default-rtdb.firebaseio.com",
  projectId: "chart-tracker-d6909",
  storageBucket: "chart-tracker-d6909.firebasestorage.app",
  messagingSenderId: "648830849134",
  appId: "1:648830849134:web:40c510d88994aee9dbd67f"
};
// ▲▲▲ ここまで ▲▲▲

let db = null;
let firebaseReady = false;
try{
  if(firebaseConfig.databaseURL && firebaseConfig.databaseURL !== "ここに貼り付け"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseReady = true;
  }
} catch(e){
  console.error('Firebase初期化エラー', e);
}

const DEFAULT_STATE = {
  colorDepots: [
    {id:'kokura', name:'小倉', stock:6},
    {id:'roppongi', name:'六本松', stock:10},
    {id:'honsha', name:'本社', stock:4}
  ],
  stoneDepots: [
    {id:'honsha', name:'本社', stock:1},
    {id:'kashii', name:'香椎', stock:8},
    {id:'roppongi', name:'六本松', stock:6}
  ],
  stores: [
    { id:'kasuga', name:'アクロスモール春日店', open:'2026-09-14', delivery:'2026-09-04', colorAlloc:[{depot:'kokura',qty:4},{depot:'',qty:0}], stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}], colorDone:[true,true,true,true], stoneDone:[true,true,true,true], sampleDone:[false,false,false,false], colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'', sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:'7月新色にて作成依頼済み' },
    { id:'matsusaka', name:'アピタ松坂三雲店', open:'2026-10-08', delivery:'2026-09-30', colorAlloc:[{depot:'',qty:0},{depot:'',qty:0}], stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}], colorDone:[false,false,false,false], stoneDone:[false,false,false,false], sampleDone:[false,false,false,false], colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'', sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:'' },
    { id:'izumisano', name:'泉佐野（エレガンス）', open:'2026-10-13', delivery:'2026-10-02', colorAlloc:[{depot:'',qty:0},{depot:'',qty:0}], stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}], colorDone:[false,false,false,false], stoneDone:[false,false,false,false], sampleDone:[false,false,false,false], colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'', sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:'' },
    { id:'ikoma', name:'生駒', open:'2026-10-31', delivery:'', colorAlloc:[{depot:'',qty:0},{depot:'',qty:0}], stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}], colorDone:[false,false,false,false], stoneDone:[false,false,false,false], sampleDone:[false,false,false,false], colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'', sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:'OPEN日は予定・搬入日未定' },
    { id:'morera', name:'モレラ岐阜店', open:'', delivery:'', colorAlloc:[{depot:'',qty:0},{depot:'',qty:0}], stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}], colorDone:[false,false,false,false], stoneDone:[false,false,false,false], sampleDone:[false,false,false,false], colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'', sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:'OPENは11月末～12月予定・搬入日未定' }
  ]
};

let state = null;

function newId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function isIsoDate(str){
  return /^\d{4}-\d{2}-\d{2}$/.test(str||'');
}

function migrateState(loaded){
  // 旧バージョンのデータ（depots/depot単一構造）を新構造に補完する
  if(!loaded.colorDepots && loaded.depots){
    loaded.colorDepots = loaded.depots;
    delete loaded.depots;
  }
  if(!loaded.stoneDepots){
    loaded.stoneDepots = JSON.parse(JSON.stringify(DEFAULT_STATE.stoneDepots));
  }
  // 倉庫が「固定オブジェクト」形式(旧構造)なら「配列」形式に変換する
  ['colorDepots','stoneDepots'].forEach(key=>{
    if(loaded[key] && !Array.isArray(loaded[key])){
      loaded[key] = Object.keys(loaded[key]).map(k=>({id:k, name:k, stock:loaded[key][k]}));
    }
    if(!Array.isArray(loaded[key])) loaded[key] = [];
  });
  (loaded.stores||[]).forEach(s=>{
    if(s.colorDepot !== undefined){
      s.colorAlloc = s.colorDepot ? [{depot:s.colorDepot, qty: (s.colorDone||[]).filter(Boolean).length || 4},{depot:'',qty:0}] : [{depot:'',qty:0},{depot:'',qty:0}];
      delete s.colorDepot;
    }
    if(s.stoneDepot !== undefined){
      s.stoneAlloc = s.stoneDepot ? [{depot:s.stoneDepot, qty: (s.stoneDone||[]).filter(Boolean).length || 4},{depot:'',qty:0}] : [{depot:'',qty:0},{depot:'',qty:0}];
      delete s.stoneDepot;
    }
    if(!s.colorAlloc) s.colorAlloc = [{depot:'',qty:0},{depot:'',qty:0}];
    if(!s.stoneAlloc) s.stoneAlloc = [{depot:'',qty:0},{depot:'',qty:0}];
    if(s.colorAlloc.length < 2) s.colorAlloc.push({depot:'',qty:0});
    if(s.stoneAlloc.length < 2) s.stoneAlloc.push({depot:'',qty:0});
    if(!s.sampleDone) s.sampleDone = [false,false,false,false];
    if(s.colorRequestStore === undefined) s.colorRequestStore = '';
    if(s.colorRequester === undefined) s.colorRequester = '';
    if(s.stoneRequestStore === undefined) s.stoneRequestStore = '';
    if(s.stoneRequester === undefined) s.stoneRequester = '';
    if(s.sampleRequestStore === undefined) s.sampleRequestStore = '';
    if(s.sampleRequester === undefined) s.sampleRequester = '';
    if(s.shipDate === undefined) s.shipDate = '';
    if(s.shipStatus === undefined) s.shipStatus = '未発送';
    if(s.open && !isIsoDate(s.open)){
      s.note = (s.note ? s.note + '　' : '') + `[旧OPEN日:${s.open}]`;
      s.open = '';
    }
    if(s.delivery && !isIsoDate(s.delivery)){
      s.note = (s.note ? s.note + '　' : '') + `[旧搬入日:${s.delivery}]`;
      s.delivery = '';
    }
  });
  return loaded;
}

async function loadState(){
  if(firebaseReady){
    // Firebase接続時：リアルタイムで全員の変更を同期する
    db.ref(STORAGE_KEY).on('value', snapshot => {
      const val = snapshot.val();
      state = val ? migrateState(val) : JSON.parse(JSON.stringify(DEFAULT_STATE));
      render();
    }, err => {
      console.error('Firebase読み込みエラー', err);
      document.getElementById('app').innerHTML = '<div class="loading">データベースに接続できませんでした。設定(firebaseConfig / セキュリティルール)を確認してください。</div>';
    });
    return;
  }
  // Firebase未設定時：この端末のブラウザだけに保存（共有はされません）
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = migrateState(JSON.parse(raw));
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  } catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  render();
}

async function saveState(){
  if(firebaseReady){
    try{
      await db.ref(STORAGE_KEY).set(state);
    } catch(e){
      console.error('Firebase保存エラー', e);
      alert('保存に失敗しました。ネット接続または設定をご確認ください。');
    }
    return;
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){
    console.error('保存に失敗しました', e);
  }
}

async function resetState(){
  if(!confirm('全データを初期状態に戻します。よろしいですか？')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  await saveState();
  render();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr);
  target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}

function urgencyBadge(dateStr){
  if(!dateStr) return {cls:'tbd', text:'搬入日 未定'};
  const d = daysUntil(dateStr);
  if(d < 0) return {cls:'urgent', text:`搬入日超過 ${Math.abs(d)}日`};
  if(d <= 7) return {cls:'urgent', text:`残り ${d}日`};
  if(d <= 21) return {cls:'soon', text:`残り ${d}日`};
  return {cls:'ok', text:`残り ${d}日`};
}

function computeAllocation(depotKey, allocField){
  const alloc = {};
  state[depotKey].forEach(d=>alloc[d.id]=0);
  state.stores.forEach(s=>{
    (s[allocField]||[]).forEach(a=>{
      if(a.depot && alloc.hasOwnProperty(a.depot)){
        alloc[a.depot] += Number(a.qty)||0;
      }
    });
  });
  return alloc;
}

function depotRowHtml(depotKey, allocField, unitNote){
  const alloc = computeAllocation(depotKey, allocField);
  const totalStock = state[depotKey].reduce((sum,d)=>sum+Number(d.stock||0),0);
  const totalAlloc = Object.values(alloc).reduce((a,b)=>a+b,0);
  const totalRequired = state.stores.length * 4;
  const cards = state[depotKey].map(d=>{
    const stock = Number(d.stock||0);
    const used = alloc[d.id]||0;
    const remain = stock - used;
    const warn = remain < 0;
    return `
    <div class="depot-card">
      <button class="depot-delete" data-depotkey="${depotKey}" data-id="${d.id}" title="この保管場所を削除">×</button>
      <input type="text" class="depot-name-input" value="${d.name}" data-depotkey="${depotKey}" data-id="${d.id}">
      <div class="stockrow">
        <input type="number" min="0" value="${stock}" data-depotkey="${depotKey}" data-id="${d.id}" class="depot-input">
        <span style="font-size:11px;color:var(--muted);">セット</span>
      </div>
      <div class="alloc ${warn?'warn':''}">振分済み <b>${used}</b> ／ 残 <b>${remain}</b></div>
    </div>`;
  }).join('');

  return `
    <div class="depot-row">
      ${cards}
      <div class="depot-card depot-add-card" data-depotkey="${depotKey}">
        <div class="depot-add-inner">＋ 保管場所を追加</div>
      </div>
    </div>
    <div class="totals-bar">
      <span>${unitNote}合計在庫 <b>${totalStock}</b></span>
      <span>${unitNote}必要数(全店) <b>${totalRequired}</b></span>
      <span>振分済み合計 <b>${totalAlloc}</b></span>
    </div>
  `;
}

function depotOptionsHtml(depotKey, selectedId){
  const opts = state[depotKey].map(d=>`<option value="${d.id}" ${selectedId===d.id?'selected':''}>${d.name}</option>`).join('');
  return `<option value="" ${selectedId===''?'selected':''}>倉庫未定</option>${opts}`;
}

function render(){
  const app = document.getElementById('app');

  const sortedStores = [...state.stores].sort((a,b)=>{
    if(!a.delivery && !b.delivery) return 0;
    if(!a.delivery) return 1;
    if(!b.delivery) return -1;
    return new Date(a.delivery) - new Date(b.delivery);
  });

  let html = `
    <div class="header">
      <div>
        <h1>新店チャート手配台帳</h1>
        <p>カラーチャート／ストーンチャート／サンプルオプション　各4台　新規出店対応</p>
      </div>
      <div class="stamp">在庫管理</div>
    </div>

    <div class="section-title">カラーチャート在庫（保管場所別）</div>
    ${depotRowHtml('colorDepots', 'colorAlloc', 'カラーチャート')}

    <div class="section-title">ストーンチャート在庫（保管場所別）</div>
    ${depotRowHtml('stoneDepots', 'stoneAlloc', 'ストーンチャート')}

    <div class="section-title">サンプルオプション在庫</div>
    <div class="totals-bar">
      <span>サンプルオプション合計在庫 <b>0</b></span>
      <span>サンプルオプション必要数(全店) <b>${state.stores.length * 4}</b></span>
      <span style="color:var(--muted);">※ 在庫なし・全店新規作成対応</span>
    </div>

    <div class="section-title">出店店舗（搬入日順）</div>
    <div class="add-store-row">
      <input type="text" id="newStoreName" class="add-store-input" placeholder="新しい店舗名">
      <label class="date-field">
        <span class="date-field-label">OPEN日</span>
        <input type="date" id="newStoreOpen" class="add-store-input add-store-input-small">
      </label>
      <label class="date-field">
        <span class="date-field-label">搬入日</span>
        <input type="date" id="newStoreDelivery" class="add-store-input add-store-input-small">
      </label>
      <button id="addStoreBtn" class="add-store-btn">＋ 店舗を追加</button>
    </div>
  `;

  sortedStores.forEach(s=>{
    const badge = urgencyBadge(s.delivery);
    const colorCount = s.colorDone.filter(Boolean).length;
    const stoneCount = s.stoneDone.filter(Boolean).length;
    const sampleCount = s.sampleDone.filter(Boolean).length;
    const total = colorCount + stoneCount + sampleCount;
    const isComplete = colorCount === 4 && stoneCount === 4 && sampleCount === 4;
    let statusCls = 'none', statusText = '未着手';
    if(isComplete){ statusCls='done'; statusText='完了'; }
    else if(total > 0){ statusCls='partial'; statusText=`進行中 (色${colorCount}/4・石${stoneCount}/4・サンプル${sampleCount}/4)`; }

    html += `
    <div class="store-card" data-store="${s.id}">
      ${isComplete ? '<div class="complete-stamp">完了</div>' : ''}
      <button class="store-delete" data-store="${s.id}" title="この店舗を削除">×</button>
      <div class="store-top">
        <div class="store-name-block">
          <span class="badge ${badge.cls}">${badge.text}</span>
          <h3>${s.name}</h3>
          <div class="dates-edit">
            <label class="date-field">
              <span class="date-field-label">OPEN</span>
              <input type="date" class="date-input" value="${s.open||''}" data-store="${s.id}" data-field="open">
            </label>
            <label class="date-field">
              <span class="date-field-label">搬入日</span>
              <input type="date" class="date-input" value="${s.delivery||''}" data-store="${s.id}" data-field="delivery">
            </label>
          </div>
        </div>
      </div>

      <div class="progress-block">
        <div class="progress-row">
          <div class="label">カラーチャート ${colorCount}/4</div>
          <div class="chips">
            ${s.colorDone.map((v,i)=>`<div class="chip circle ${v?'on':''}" data-store="${s.id}" data-type="color" data-idx="${i}"></div>`).join('')}
          </div>
          <div class="alloc-slots">
            ${s.colorAlloc.map((a,i)=>`
            <div class="alloc-slot">
              <select class="depot-select mini-select" data-store="${s.id}" data-alloc="colorAlloc" data-slot="${i}" data-part="depot">
                ${depotOptionsHtml('colorDepots', a.depot)}
              </select>
              <input type="number" min="0" max="4" class="qty-input" value="${a.qty}" data-store="${s.id}" data-alloc="colorAlloc" data-slot="${i}" data-part="qty">
            </div>`).join('')}
            <span class="alloc-total ${(s.colorAlloc.reduce((sum,a)=>sum+Number(a.qty||0),0)!==4)?'mismatch':''}">計 ${s.colorAlloc.reduce((sum,a)=>sum+Number(a.qty||0),0)}/4</span>
          </div>
          <div class="sample-meta">
            <input type="text" class="mini-input" placeholder="作成依頼店舗" value="${s.colorRequestStore || ''}" data-store="${s.id}" data-field="colorRequestStore">
            <input type="text" class="mini-input" placeholder="依頼者" value="${s.colorRequester || ''}" data-store="${s.id}" data-field="colorRequester">
          </div>
        </div>
        <div class="progress-row">
          <div class="label">ストーンチャート ${stoneCount}/4</div>
          <div class="chips">
            ${s.stoneDone.map((v,i)=>`<div class="chip diamond ${v?'on':''}" data-store="${s.id}" data-type="stone" data-idx="${i}"></div>`).join('')}
          </div>
          <div class="alloc-slots">
            ${s.stoneAlloc.map((a,i)=>`
            <div class="alloc-slot">
              <select class="depot-select mini-select" data-store="${s.id}" data-alloc="stoneAlloc" data-slot="${i}" data-part="depot">
                ${depotOptionsHtml('stoneDepots', a.depot)}
              </select>
              <input type="number" min="0" max="4" class="qty-input" value="${a.qty}" data-store="${s.id}" data-alloc="stoneAlloc" data-slot="${i}" data-part="qty">
            </div>`).join('')}
            <span class="alloc-total ${(s.stoneAlloc.reduce((sum,a)=>sum+Number(a.qty||0),0)!==4)?'mismatch':''}">計 ${s.stoneAlloc.reduce((sum,a)=>sum+Number(a.qty||0),0)}/4</span>
          </div>
          <div class="sample-meta">
            <input type="text" class="mini-input" placeholder="作成依頼店舗" value="${s.stoneRequestStore || ''}" data-store="${s.id}" data-field="stoneRequestStore">
            <input type="text" class="mini-input" placeholder="依頼者" value="${s.stoneRequester || ''}" data-store="${s.id}" data-field="stoneRequester">
          </div>
        </div>
        <div class="progress-row">
          <div class="label">サンプルオプション ${sampleCount}/4</div>
          <div class="chips">
            ${s.sampleDone.map((v,i)=>`<div class="chip square ${v?'on':''}" data-store="${s.id}" data-type="sample" data-idx="${i}"></div>`).join('')}
          </div>
          <div class="sample-meta">
            <input type="text" class="mini-input" placeholder="作成依頼店舗" value="${s.sampleRequestStore || ''}" data-store="${s.id}" data-field="sampleRequestStore">
            <input type="text" class="mini-input" placeholder="依頼者" value="${s.sampleRequester || ''}" data-store="${s.id}" data-field="sampleRequester">
          </div>
        </div>
      </div>

      <div class="ship-row">
        <span class="ship-label">発送管理</span>
        <label class="date-field">
          <span class="date-field-label">発送日</span>
          <input type="date" class="date-input" value="${s.shipDate||''}" data-store="${s.id}" data-field="shipDate">
        </label>
        <select class="ship-status-select ship-status-${s.shipStatus}" data-store="${s.id}">
          <option value="未発送" ${s.shipStatus==='未発送'?'selected':''}>未発送</option>
          <option value="発送済み" ${s.shipStatus==='発送済み'?'selected':''}>発送済み</option>
          <option value="到着済み" ${s.shipStatus==='到着済み'?'selected':''}>到着済み</option>
        </select>
      </div>

      <div class="status-note-row">
        <span class="status-label ${statusCls}">${statusText}</span>
        <input type="text" class="note-input" placeholder="メモを入力" value="${s.note || ''}" data-store="${s.id}" data-field="note">
      </div>
    </div>`;
  });

  html += `
    <div class="footer-bar">
      <span>クリックで進捗チップを切替／入力は自動保存されます</span>
      <button class="reset-btn" id="resetBtn">初期状態にリセット</button>
    </div>
  `;

  app.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.depot-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const depotKey = e.target.dataset.depotkey;
      const id = e.target.dataset.id;
      const d = state[depotKey].find(x=>x.id===id);
      if(d) d.stock = Number(e.target.value) || 0;
      saveState();
      render();
    });
  });

  document.querySelectorAll('.depot-name-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const depotKey = e.target.dataset.depotkey;
      const id = e.target.dataset.id;
      const d = state[depotKey].find(x=>x.id===id);
      if(d) d.name = e.target.value || d.name;
      saveState();
      render();
    });
  });

  document.querySelectorAll('.depot-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      const depotKey = e.target.dataset.depotkey;
      const id = e.target.dataset.id;
      const d = state[depotKey].find(x=>x.id===id);
      if(!d) return;
      if(!confirm(`「${d.name}」を削除しますか？この倉庫を引当先にしている店舗があれば、未定に戻ります。`)) return;
      state[depotKey] = state[depotKey].filter(x=>x.id!==id);
      const allocField = depotKey === 'colorDepots' ? 'colorAlloc' : 'stoneAlloc';
      state.stores.forEach(s=>{
        s[allocField].forEach(a=>{ if(a.depot===id){ a.depot=''; a.qty=0; } });
      });
      saveState();
      render();
    });
  });

  document.querySelectorAll('.depot-add-card').forEach(el=>{
    el.addEventListener('click', e=>{
      const depotKey = e.currentTarget.dataset.depotkey;
      const name = prompt('新しい保管場所の名前を入力してください（例：福岡倉庫）');
      if(!name) return;
      state[depotKey].push({id:newId('depot'), name:name, stock:0});
      saveState();
      render();
    });
  });

  document.getElementById('addStoreBtn').addEventListener('click', ()=>{
    const nameEl = document.getElementById('newStoreName');
    const openEl = document.getElementById('newStoreOpen');
    const deliveryEl = document.getElementById('newStoreDelivery');
    const name = nameEl.value.trim();
    if(!name){ alert('店舗名を入力してください'); return; }
    state.stores.push({
      id:newId('store'), name:name,
      open: openEl.value.trim(), delivery: deliveryEl.value.trim(),
      colorAlloc:[{depot:'',qty:0},{depot:'',qty:0}],
      stoneAlloc:[{depot:'',qty:0},{depot:'',qty:0}],
      colorDone:[false,false,false,false], stoneDone:[false,false,false,false], sampleDone:[false,false,false,false],
      colorRequestStore:'', colorRequester:'', stoneRequestStore:'', stoneRequester:'',
      sampleRequestStore:'', sampleRequester:'', shipDate:'', shipStatus:'未発送', note:''
    });
    saveState();
    render();
  });

  document.querySelectorAll('.store-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.target.dataset.store;
      const s = state.stores.find(x=>x.id===id);
      if(!s) return;
      if(!confirm(`「${s.name}」を削除しますか？この操作は元に戻せません。`)) return;
      state.stores = state.stores.filter(x=>x.id!==id);
      saveState();
      render();
    });
  });

  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', e=>{
      const {store, type, idx} = e.target.dataset;
      const s = state.stores.find(x=>x.id===store);
      const arr = type==='color' ? s.colorDone : type==='stone' ? s.stoneDone : s.sampleDone;
      arr[Number(idx)] = !arr[Number(idx)];
      saveState();
      render();
    });
  });

  document.querySelectorAll('.depot-select').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      const slot = s[e.target.dataset.alloc][Number(e.target.dataset.slot)];
      slot.depot = e.target.value;
      saveState();
      render();
    });
  });

  document.querySelectorAll('.qty-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      const allocField = e.target.dataset.alloc;
      const slot = s[allocField][Number(e.target.dataset.slot)];
      let v = Number(e.target.value) || 0;
      if(v < 0) v = 0;
      if(v > 4) v = 4;
      slot.qty = v;

      const total = Math.min(4, s[allocField].reduce((sum,a)=>sum+Number(a.qty||0),0));
      const doneField = allocField === 'colorAlloc' ? 'colorDone' : 'stoneDone';
      s[doneField] = [0,1,2,3].map(i=>i < total);

      saveState();
      render();
    });
  });

  document.querySelectorAll('.mini-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      s[e.target.dataset.field] = e.target.value;
      saveState();
    });
  });

  document.querySelectorAll('.ship-status-select').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      s.shipStatus = e.target.value;
      saveState();
      render();
    });
  });

  document.querySelectorAll('.date-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      s[e.target.dataset.field] = e.target.value;
      saveState();
      render();
    });
  });

  document.querySelectorAll('.note-input').forEach(el=>{
    el.addEventListener('change', e=>{
      const s = state.stores.find(x=>x.id===e.target.dataset.store);
      s.note = e.target.value;
      saveState();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', resetState);
}

loadState();
</script>
</body>
</html>
